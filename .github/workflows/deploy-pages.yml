# Pushes static build to branch `gh-pages` (same as `npm run deploy`).
# In repo Settings → Pages: source = Deploy from branch → gh-pages → / (root).

name: Deploy GitHub Pages

on:
  push:
    branches:
      - develop
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci --legacy-peer-deps

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build:prod
        env:
          PUBLIC_PATH: /Print-Shop-Management/
          NODE_OPTIONS: --max-old-space-size=8192

      - name: Add .nojekyll
        run: touch build/.nojekyll

      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
          force_orphan: true
