# AccurioPrint C3070 / C3070L
# Панель: Всего, Ч/Б, Цвет — уже готовые суммы, без сложения «печать + копия».
id: km_c3070
title: AccurioPrint C3070 / C3070L
order: 1
profile: konica_minolta
detect:
  - C3070

# Коды, которыми снимаются нужные счётчики.
# Таблица mltSysPrintFunctionCounterTable, enterprise 18334:
#   значение .2.1.5.<цвет>.<функция>
#   цвет 1 = Ч/Б, 2 = полный цвет (4C)
#   функция 1 = копия, 2 = печать, 3 = вход, 4 = факс, 5 = отчёт
# «Ч/Б» и «Цвет» — сумма всех функций своего цвета, не один лист.
snmp:
  total:
    oid: 1.3.6.1.4.1.18334.1.1.1.5.7.2.1.1.0
    name: mltSysTotalCount
  black:
    name: Ч/Б, сумма функций цвета 1 (BW)
    sum:
      - oid: 1.3.6.1.4.1.18334.1.1.1.5.7.2.2.1.5.1.1
        name: Ч/Б, копия
      - oid: 1.3.6.1.4.1.18334.1.1.1.5.7.2.2.1.5.1.2
        name: Ч/Б, печать
      - oid: 1.3.6.1.4.1.18334.1.1.1.5.7.2.2.1.5.1.3
        name: Ч/Б, вход
      - oid: 1.3.6.1.4.1.18334.1.1.1.5.7.2.2.1.5.1.4
        name: Ч/Б, факс
      - oid: 1.3.6.1.4.1.18334.1.1.1.5.7.2.2.1.5.1.5
        name: Ч/Б, отчёт
  color:
    name: Цвет, сумма функций цвета 2 (4C)
    sum:
      - oid: 1.3.6.1.4.1.18334.1.1.1.5.7.2.2.1.5.2.1
        name: Цвет, копия
      - oid: 1.3.6.1.4.1.18334.1.1.1.5.7.2.2.1.5.2.2
        name: Цвет, печать
      - oid: 1.3.6.1.4.1.18334.1.1.1.5.7.2.2.1.5.2.3
        name: Цвет, вход
      - oid: 1.3.6.1.4.1.18334.1.1.1.5.7.2.2.1.5.2.4
        name: Цвет, факс
      - oid: 1.3.6.1.4.1.18334.1.1.1.5.7.2.2.1.5.2.5
        name: Цвет, отчёт

billing:
  - key: total
    label: Всего
    rule: label
    match: Всего
  - key: color
    label: Цвет
    rule: label
    match: Цвет
  - key: black
    label: Ч/Б
    rule: label
    match: Ч/Б
