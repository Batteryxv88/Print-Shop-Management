# AccurioPress C6100
# Всего — общий лист.
# Ч/Б — только «печать» + «копия», без входа, факса и отчёта.
# Цвет — подпись «Полный цвет» (сумма 4C), не сводное «Цвет» и не 1–2 цвета.
id: km_c6100
title: AccurioPress C6100
order: 2
profile: konica_minolta
detect:
  - C6100

snmp:
  total:
    oid: 1.3.6.1.4.1.18334.1.1.1.5.7.2.1.1.0
    name: mltSysTotalCount
  black:
    name: Ч/Б, только печать + Ч/Б, копия
    sum:
      - oid: 1.3.6.1.4.1.18334.1.1.1.5.7.2.2.1.5.1.2
        name: Ч/Б, только печать
      - oid: 1.3.6.1.4.1.18334.1.1.1.5.7.2.2.1.5.1.1
        name: Ч/Б, копия
  color:
    name: Полный цвет, сумма функций цвета 2 (4C)
    sum:
      - oid: 1.3.6.1.4.1.18334.1.1.1.5.7.2.2.1.5.2.1
        name: Полный цвет, копия
      - oid: 1.3.6.1.4.1.18334.1.1.1.5.7.2.2.1.5.2.2
        name: Полный цвет, печать
      - oid: 1.3.6.1.4.1.18334.1.1.1.5.7.2.2.1.5.2.3
        name: Полный цвет, вход
      - oid: 1.3.6.1.4.1.18334.1.1.1.5.7.2.2.1.5.2.4
        name: Полный цвет, факс
      - oid: 1.3.6.1.4.1.18334.1.1.1.5.7.2.2.1.5.2.5
        name: Полный цвет, отчёт

billing:
  - key: total
    label: Всего
    rule: label
    match: Всего
  - key: color
    label: Цвет
    rule: label
    match: Полный цвет
  - key: black
    label: Ч/Б
    rule: sum_labels
    match:
      - Ч/Б, только печать
      - Ч/Б, копия
