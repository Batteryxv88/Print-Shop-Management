# Ricoh Pro C7210X (контроллер E-45/E-46, 5-я станция White/Clear/Neon) и Pro 8210 (моно).
# Один профиль: скаляр ricohEngCounterTotal совпадает с «Total», а Ч/Б, полный цвет
# и 5-й цвет читаются обходом ricohEngCounterTable, не фиксированным индексом.
# Private MIB v4: 1.3.6.1.4.1.367.3.2.1.2.19.5.1
#   type .2, name .5 (строка локализована), descr .6, value .9.
#   type 600 = Total Prints: Full Color, 609 = Total Prints: Black & White.
#   type 606 «Printer: Color» и 602/603 Development — не счётчик панели.
# Индексы .9.17/.9.18/.9.60/.9.61 с офисных списков на M061 — это
# Printer: Color/BW и Coverage, не биллинг и не 5-й цвет. На C7210X индекс 5-й
# станции другой, поэтому строка ищется по имени (Special Color, 5th, White, Clear, Neon).
# Pro 8210: нет Full Color и 5-го цвета — пустые строки не считаются ошибкой.
# C7210X (E-46), сверка с панелью 2026-11-05, data/snmp_walk_192.168.88.119.txt:
#   Цвет = type 608 Total Prints: Color, Ч/Б = type 609 Total Prints: Black & White,
#   5-й цвет = type 2001 Counter: Fifth Station Total, Всего = type 10 / .19.1.0.
#   Type 600 Full Color и type 601 Monocolor с панелью не совпали.
# https://mibs.observium.org/object/RicohPrivateMIB/ricohEngCounter
# https://forum.iobroker.net/assets/uploads/files/294_privatemibspecificationv4_050-4.pdf
id: ricoh
display_name: Ricoh Pro (C7210X / 8210)
enterprise_ids:
  - "367"
collect_printer_mib_supplies: false
component_filter:
  exclude_keywords:
    - toner
    - ink
    - staple
    - waste
    - bottle
    - cartridge
    - powder
  include_keywords:
    - drum
    - belt
    - fuser
    - developer
    - charge
    - roller
    - opc
    - photoconductor
    - transfer
    - fixing
    - cleaning
    - blade
    - unit
    - life
    - maintenance
counter_walks:
  - id: ricoh_engine
    mapper: ricoh_engine
    max_rows: 400
    preserve_keys:
      - total
    columns:
      - value_oid: 1.3.6.1.4.1.367.3.2.1.2.19.5.1.9
        name_oid: 1.3.6.1.4.1.367.3.2.1.2.19.5.1.5
        descr_oid: 1.3.6.1.4.1.367.3.2.1.2.19.5.1.6
        type_oid: 1.3.6.1.4.1.367.3.2.1.2.19.5.1.2
metrics:
  - key: sys_name
    oid: 1.3.6.1.2.1.1.5.0
    label: Имя устройства
    category: info
  - key: total
    oid: 1.3.6.1.4.1.367.3.2.1.2.19.1.0
    label: Всего
    category: counter
  - key: print_mode
    oid: 1.3.6.1.4.1.367.3.2.1.2.19.2.0
    label: Режим печати
    category: counter
  - key: fax_mode
    oid: 1.3.6.1.4.1.367.3.2.1.2.19.3.0
    label: Режим fax
    category: counter
  - key: copy_mode
    oid: 1.3.6.1.4.1.367.3.2.1.2.19.4.0
    label: Режим копирования
    category: counter
  # Диагностика. Не подставляются в «Цвет»/«Ч/Б»: на части моделей это не те корзины.
  - key: legacy_idx17
    oid: 1.3.6.1.4.1.367.3.2.1.2.19.5.1.9.17
    label: Индекс 17 (не биллинг)
    category: counter
    optional: true
  - key: legacy_idx18
    oid: 1.3.6.1.4.1.367.3.2.1.2.19.5.1.9.18
    label: Индекс 18 (не биллинг)
    category: counter
    optional: true
  - key: legacy_idx60
    oid: 1.3.6.1.4.1.367.3.2.1.2.19.5.1.9.60
    label: Индекс 60 (не биллинг)
    category: counter
    optional: true
  - key: legacy_idx61
    oid: 1.3.6.1.4.1.367.3.2.1.2.19.5.1.9.61
    label: Индекс 61 (не биллинг)
    category: counter
    optional: true
  - key: total_fallback
    oid: 1.3.6.1.2.1.43.10.2.1.4.1.1
    label: Общий счётчик (Printer-MIB fallback)
    category: counter
    optional: true
